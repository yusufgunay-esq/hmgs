<!--
  أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ
  بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ
  رَبِّ يَسِّرْ وَلَا تُعَسِّرْ رَبِّ تَمِّمْ بِالْخَيْرِ
-->
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: çentik/köşe boşluklarını env(safe-area-inset-*) ile biz yönetiyoruz.
       Yakınlaştırma bilerek serbest bırakıldı — kanun metni okunurken gerekebiliyor. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>HMGS Stüdyo — Kişisel Çalışma Koçu</title>

  <!-- Telefona uygulama olarak kurulum (PWA) -->
  <link rel="manifest" href="studio.webmanifest">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Stüdyo">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
  <link rel="shortcut icon" href="icons/favicon.ico">

  <link rel="stylesheet" href="studio/css/studio.css">
  <!-- Mobil katman: studio.css'ten SONRA gelmeli, tüm kuralları @media içinde -->
  <link rel="stylesheet" href="studio/css/studio-mobile.css">
  <!-- Google Identity Services (Drive Vault Eşitleme) -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <header class="topbar">
    <div class="brand">HMGS <span>Stüdyo</span></div>
    <nav class="nav">
      <button data-view="today"    aria-current="true">Bugün</button>
      <button data-view="odevler"  aria-current="false">Ödevler</button>
      <button data-view="flow"     aria-current="false">Konular</button>
      <button data-view="practice" aria-current="false">Soru</button>
      <button data-view="pratik"   aria-current="false">Pratik</button>
      <button data-view="exam"     aria-current="false">Deneme</button>
      <button data-view="progress" aria-current="false">İlerleme</button>
    </nav>
    <a href="index.html" class="nav-portal-link" style="text-decoration:none;font-size:0.75rem;font-weight:700;padding:0.35rem 0.65rem;border-radius:0.5rem;background:rgba(99,102,241,0.12);color:#4f46e5;border:1px solid rgba(99,102,241,0.25);margin-left:auto;margin-right:0.5rem;display:inline-flex;align-items:center;gap:0.3rem" title="HMGS Takip Uygulamasına Dön">📊 Takip</a>
    <span class="countdown" id="countdown">Sınava <b>–</b></span>
  </header>

  <main>
    <section id="view-today"    class="view on"></section>
    <section id="view-odevler"  class="view"></section>
    <section id="view-flow"     class="view"></section>
    <section id="view-practice" class="view"></section>
    <section id="view-pratik"   class="view"></section>
    <section id="view-exam"     class="view"></section>
    <section id="view-progress" class="view"></section>
  </main>

  <!-- Etkileşimli görsel motoru (window.HMGSV3) -->
  <script src="js/visual-engines-v3.js"></script>

  <!-- Uygulama: ES modülleri (Vault & IndexedDB Destekli) -->
  <script type="module" src="studio/js/main.js"></script>

  <!-- Servis çalışanı: yalnız güvenli bağlamda (https / localhost) kayıt olur. -->
  <script>
    if ('serviceWorker' in navigator && window.isSecureContext) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('[sw] kayıt olmadı:', err));
      });
    }

    // Yalnızca file:// protokolü ile açıldığında uyar (CORS engeli)
    if (location.protocol === 'file:') {
      window.addEventListener('DOMContentLoaded', function() {
        var host = document.getElementById('view-today');
        if (host) {
          host.innerHTML = '<div class="wrap" style="padding:2rem 1rem"><div class="card" style="border-left:4px solid var(--warn);background:#fff">' +
            '<h3 style="font-size:1.15rem;font-weight:700;margin-bottom:0.6rem;color:var(--ink)">HMGS Stüdyo Yerel Sunucu Gerektiriyor</h3>' +
            '<p style="color:var(--ink-2);font-size:0.92rem;line-height:1.6;margin-bottom:1.2rem">' +
            'Uygulama doğrudan dosya sisteminden (<code>file://</code>) açıldığı için tarayıcı güvenlik politikası (CORS) gereği JavaScript modülleri engellendi.' +
            '<br><br><b>Çözüm:</b> Proje klasöründeki <code>baslat.bat</code> dosyasını çalıştırın veya tarayıcıda <b><a href="http://localhost:8766/studio.html" style="color:var(--accent);text-decoration:underline">http://localhost:8766/studio.html</a></b> adresini açın.</p>' +
            '<a href="http://localhost:8766/studio.html" class="btn" style="text-decoration:none;display:inline-block">http://localhost:8766 Adresine Git</a>' +
            '</div></div>';
        }
      });
    }
  </script>
</body>
</html>
